 request_realm_priest_replacement_interaction_desc: "Объявить, что вам требуется новый [Concept('realm_priest', actor.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|El]. Будут представлены кандидаты из числа следующих персонажей, не входящих в [Concept('councillors', 'совет')|E]:\n$BULLET_WITH_TAB$[Concept('courtiers', 'Придворные')|E] в вашей [Concept('realm', 'державе')|E]\n$BULLET_WITH_TAB$[Concept('courtiers', 'Придворные')|E] [Concept('religious_superior', 'вышестоящего духовного лица')|E], которому подчиняется ваш [Concept('realm_priest', actor.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|El]\n$BULLET_WITH_TAB$Ваши [Concept('theocratic', 'теократические')|E] [Concept('vassals', 'вассалы')|E]\n$BULLET_WITH_TAB$Взрослые члены [Concept('house', 'дома')|E] со свойством «[GetTrait('devoted').GetName(GetNullCharacter)]», не являющиеся [Concept('rulers', 'правителями')|E]"
